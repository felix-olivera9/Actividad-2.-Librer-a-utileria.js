<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Utileria.js</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <h2>Iniciar Sesion</h2>
    <form id="loginForm">
      
      <div class="form-group">
        <label for="loginCorreo">Correo Electronico:</label>
        <input type="email" id="loginCorreo" placeholder="felix@itoaxaca.edu.mx" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña:</label>
        <input type="password" id="loginPassword" placeholder="Olivera1234*" required>
        <small style="color: #666; display: block; margin-top: 4px;">Mín 8 chars, 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial.</small>
      </div>

      <button type="submit">Iniciar Sesion</button>
      <button type="button" id="btnLimpiarLogin" class="btn-secondary">Limpiar Campos</button>
    </form>

    <div id="mensajeLogin"></div>

    <div class="nav-link">
      <a href="index.html">Volver al Menu Principal</a>
    </div>
  </div>

  <!-- Importacion de la libreria -->
  <script src="js/utileria.js"></script>
  <script>
    
    const correo_fe = "felix@gmail.com";
    const contra_fe = "Olivera1234$";

    const loginForm = document.getElementById('loginForm');
    const mensajeLogin = document.getElementById('mensajeLogin');
    const btnLimpiarLogin = document.getElementById('btnLimpiarLogin');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const correo = document.getElementById('loginCorreo').value;
      const contraseña = document.getElementById('loginPassword').value;
      /*Imprimir estado de validación en consola*/
      console.log("--- INTENTO DE LOGIN ---");
      console.log("Correo evaluado:", correo, "Válido:", Utileria.validarCorreo(correo));
      console.log("Contraseña evaluada:", contraseña, "Válida:", Utileria.validarContra(contraseña));

      
      if (!Utileria.validarCorreo(correo)) {
        console.warn("Login fallido: Correo con formato inválido.");
        mensajeLogin.innerHTML = '<span class="error-msg">Correo con formato invalido.</span>';
        return;
      }

   
      if (!Utileria.validarContra(contraseña)) {
        console.warn("Login fallido: Contraseña no cumple seguridad.");
        mensajeLogin.innerHTML = '<span class="error-msg">La contraseña no cumple con los requisitos de seguridad.</span>';
        return;
      }

      
      if (correo === correo_fe && contraseña === contra_fe) {
        console.log("¡Login exitoso! Las credenciales coinciden con los valores por defecto.");
        mensajeLogin.innerHTML = '<span class="success-msg">!Login exitoso! Bienvenido al sistema.</span>';
      } else {
        console.warn("Login fallido: Las credenciales por defecto no coinciden.");
        mensajeLogin.innerHTML = '<span class="error-msg">Correo o contraseña incorrectos (Valores por defecto no coinciden).</span>';
      }
    });


    btnLimpiarLogin.addEventListener('click', function() {
      console.log("Limpiando campos del login...");
      Utileria.limpiarCampos(loginForm);
      mensajeLogin.innerHTML = '';
    });
  </script>
</body>
</html>
